# Render Blueprint: Render reads this file to create the web service.
services:
  - type: web
    name: trainer-central-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false          # you type the secret value in the Render dashboard
      - key: CLAUDE_MODEL
        value: claude-haiku-5-5
      - key: DASHBOARD_URL
        value: https://trainer-central-assigments-api.onrender.com
